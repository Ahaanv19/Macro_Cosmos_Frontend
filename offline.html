<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Macro Cosmos</title>
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/icons/favicon-32.png">
  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:linear-gradient(160deg,#0a7cc2 0%,#12b0cc 100%);color:#fff;padding:2rem;
    }
    .card{max-width:22rem}
    img{width:96px;height:96px;border-radius:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);margin-bottom:1.25rem}
    h1{font-size:1.5rem;margin:.25rem 0 .5rem;font-weight:800}
    p{opacity:.9;line-height:1.6;margin:0 0 1.5rem}
    a{display:inline-block;background:#fff;color:#0a6cb4;text-decoration:none;font-weight:700;
      padding:.75rem 1.4rem;border-radius:14px}
  </style>
</head>
<body>
  <div class="card">
    <img src="{{ site.baseurl }}/assets/icons/icon-192.png" alt="Macro Cosmos">
    <h1>You're offline</h1>
    <p>Macro Cosmos needs a connection for live traffic and routing. Reconnect and try again.</p>
    <a href="{{ site.baseurl }}/">Retry</a>
  </div>
</body>
</html>
